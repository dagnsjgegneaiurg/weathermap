<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>G-Shock Time</title>

<style>

body {
    margin:0;
    height:100vh;
    background:
      radial-gradient(circle,#333,#050505);

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;
}


.watch {

    width:360px;
    height:260px;

    background:
    linear-gradient(145deg,#222,#050505);

    border-radius:45px;

    border:12px solid #111;

    box-shadow:
    inset 0 0 30px black,
    0 30px 80px black;

    padding:20px;

}


.brand {

    color:#aaa;
    font-weight:bold;
    letter-spacing:4px;
    font-size:18px;

}


.model {

    color:#ff3333;
    font-size:12px;
}


.screen {

    margin-top:20px;

    background:
    #a9b38a;

    border-radius:12px;

    padding:20px;

    color:#111;

    box-shadow:
    inset 0 0 20px #333;

    text-align:center;

}


.time {

    font-size:52px;

    font-family:
    "Courier New",
    monospace;

    font-weight:bold;

    letter-spacing:4px;

}


.date {

    font-size:18px;

}


.info {

    display:flex;

    justify-content:space-between;

    margin-top:15px;

    color:white;

}


.button {

    background:#222;

    color:#aaa;

    padding:8px;

    border-radius:8px;

    text-align:center;

    margin-top:15px;

    font-size:12px;

}


</style>

</head>


<body>


<div class="watch">


<div class="brand">
G-SHOCK
</div>

<div class="model">
TIME.GOV SYNC
</div>


<div class="screen">


<div id="time"
class="time">
00:00:00
</div>


<div id="date"
class="date">
JAN 01 2026
</div>


</div>


<div class="info">

<div>
SYNC
<br>
<span id="sync">
LOCAL
</span>
</div>


<div>
BAT
<br>
████
</div>


<div>
24H
<br>
ON
</div>


</div>


<div class="button">
ADJUST　MODE　LIGHT
</div>


</div>



<script>


let offset=0;



async function syncTime(){


try {


let response =
await fetch(
"https://www.time.gov/?random="+Date.now(),
{
method:"HEAD",
cache:"no-cache"
}
);



let serverDate =
response.headers.get("date");



if(serverDate){

let server =
new Date(serverDate);

let local =
new Date();


offset =
server.getTime()
-
local.getTime();



document.getElementById("sync")
.innerHTML="TIME.GOV";

}


}
catch(e){

console.log(
"Time sync unavailable"
);

}


}



function update(){


let now =
new Date(
Date.now()+offset
);



let h =
String(now.getHours())
.padStart(2,"0");


let m =
String(now.getMinutes())
.padStart(2,"0");


let s =
String(now.getSeconds())
.padStart(2,"0");



document.getElementById("time")
.innerHTML =
`${h}:${m}:${s}`;



let days=[
"JAN","FEB","MAR","APR",
"MAY","JUN","JUL","AUG",
"SEP","OCT","NOV","DEC"
];



document.getElementById("date")
.innerHTML =
`${days[now.getMonth()]} ${
String(now.getDate()).padStart(2,"0")
} ${
now.getFullYear()
}`;


}



syncTime();

setInterval(update,1000);


</script>


</body>
</html>
