<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Luxury Timepiece</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:
radial-gradient(circle,#3b3b3b,#050505 70%);
font-family:Georgia,serif;
}


.watch{
width:390px;
height:390px;
border-radius:50%;

background:
linear-gradient(145deg,#d4af37,#6b4a00,#d4af37);

padding:18px;

box-shadow:
0 40px 100px #000,
inset 0 0 20px white;
}


.case{
width:100%;
height:100%;
border-radius:50%;

background:
radial-gradient(circle at 30% 20%,
rgba(255,255,255,.25),
transparent 35%),
#050505;

padding:18px;

box-shadow:
inset 0 0 40px black;

}


.dial{

position:relative;

width:100%;
height:100%;

border-radius:50%;

background:
radial-gradient(circle,
#0b5c3b,
#002416);

overflow:hidden;

box-shadow:
inset 0 0 60px black;

}



.logo{

position:absolute;
top:28%;
width:100%;
text-align:center;

color:#e8c35a;

font-size:20px;

letter-spacing:5px;

}



.marker{

position:absolute;
left:50%;
top:50%;

width:8px;
height:8px;

background:#fff1b0;

border-radius:50%;

transform-origin:0 -150px;

box-shadow:
0 0 10px gold;

}



.hand{

position:absolute;

left:50%;
bottom:50%;

transform-origin:bottom;

border-radius:10px;

}



.hour{

width:8px;
height:85px;

background:#d9b44a;

}



.minute{

width:6px;
height:120px;

background:#f5d77a;

}



.second{

width:2px;
height:140px;

background:#ff3333;

}



.center{

position:absolute;

left:50%;
top:50%;

width:18px;
height:18px;

margin:-9px;

background:#d4af37;

border-radius:50%;

}


.date{

position:absolute;

right:35px;
bottom:100px;

background:#eee;

color:#111;

padding:8px 12px;

font-family:Arial;

font-size:14px;

border-radius:3px;

}



</style>

</head>


<body>


<div class="watch">

<div class="case">

<div class="dial">


<div class="logo">
ROYAL TIME
</div>


<div id="hour"
class="hand hour"></div>

<div id="minute"
class="hand minute"></div>

<div id="second"
class="hand second"></div>


<div class="center"></div>


<div id="date"
class="date">
01
</div>


</div>

</div>

</div>



<script>


let offset=0;



// create gold hour markers

let dial=document.querySelector(".dial");


for(let i=0;i<12;i++){

let m=document.createElement("div");

m.className="marker";

m.style.transform=
`rotate(${i*30}deg) translateY(-150px)`;

dial.appendChild(m);

}



async function sync(){

try{

let r=
await fetch(
"https://www.time.gov/?x="+Date.now(),
{
method:"HEAD"
}
);


let d=r.headers.get("date");


if(d){

offset=
new Date(d).getTime()
-
Date.now();

}

}catch(e){}

}



function update(){


let now=
new Date(
Date.now()+offset
);



let h=
now.getHours()%12;

let m=
now.getMinutes();

let s=
now.getSeconds();



document.getElementById("hour")
.style.transform=
`rotate(${h*30+m/2}deg)`;


document.getElementById("minute")
.style.transform=
`rotate(${m*6}deg)`;


document.getElementById("second")
.style.transform=
`rotate(${s*6}deg)`;


document.getElementById("date")
.innerHTML=
now.getDate();


}



sync();

setInterval(update,1000);


</script>


</body>
</html>
