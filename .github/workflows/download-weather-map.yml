name: Download Weather Map Hourly

on:
  schedule:
    - cron: "0 * * * *"   # every hour at minute 0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download image
        run: |
          mkdir -p images
          curl -L \
            "https://www.weather.gov/wwamap/png/US.png" \
            -o images/US.png

      - name: Commit updated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/US.png

          git commit -m "Update weather map $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "No changes"

          git push origin main
